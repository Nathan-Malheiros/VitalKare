# =========================================================
# Mosquitto — Configuração do Broker MQTT
# VitalKare — Ambiente de desenvolvimento
# =========================================================

# Porta sem TLS (desenvolvimento local)
listener 1883
protocol mqtt

# Porta TLS (produção — descomente e configure certificados)
# listener 8883
# cafile   /mosquitto/config/certs/ca.crt
# certfile /mosquitto/config/certs/server.crt
# keyfile  /mosquitto/config/certs/server.key
# tls_version tlsv1.3

# Autenticação por usuário/senha
allow_anonymous false
password_file /mosquitto/config/passwd

# WebSocket (para debug via browser)
listener 9002
protocol websockets

# Persistência de sessões e mensagens retidas
persistence true
persistence_location /mosquitto/data/

# Logs
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Limites
max_connections 200
max_inflight_messages 20
max_queued_messages 1000
message_size_limit 102400

# Keep-alive
keepalive_interval 60
