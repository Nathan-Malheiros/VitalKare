# alembic.ini — Configuração do Alembic para VitalKare
# Referência: https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# Caminho para o diretório de migrations (relativo ao alembic.ini)
script_location = app/db/migrations

# Template usado para gerar novas revisões
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# Timezone para timestamps nas revisões
timezone = UTC

# Trunca mensagem de commit longa para nome do arquivo
truncate_slug_length = 40

# URL do banco (sobrescrita por env.py via DATABASE_URL)
sqlalchemy.url = postgresql+asyncpg://vitalkare:vitalkare@localhost:5432/vitalkare

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
